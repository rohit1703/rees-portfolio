*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#F7F6F1;color:#351E28;font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100svh}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px 24px}
.flower{width:clamp(96px,16vw,148px);height:auto;overflow:visible;margin-bottom:28px;animation:turn 32s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
h1{margin:0;font-family:"Fjalla One","Arial Narrow",Arial,sans-serif;font-weight:400;font-size:clamp(52px,11vw,148px);line-height:.92;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
p{margin:22px 0 0;max-width:30ch;font-size:clamp(18px,2.2vw,22px);line-height:1.45;color:#5C4A52;text-wrap:balance}
footer{padding:20px 24px 28px;text-align:center;font-family:"Caveat","Segoe Print",cursive;font-size:26px;line-height:1;color:#C23A17}
::selection{background:#E9F056;color:#351E28}
@media (prefers-reduced-motion:reduce){.flower{animation:none}}
</style>
